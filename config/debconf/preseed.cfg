# debconf selections applied in the chroot before package installation
# Microsoft core fonts EULA (ttf-mscorefonts-installer downloads fonts from
# SourceForge at install time: needs network in the build chroot; if offline
# the package installs but fonts are fetched later by `update-ms-fonts`).
ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula boolean true
ttf-mscorefonts-installer msttcorefonts/present-mscorefonts-eula note
# Locale / keyboard defaults (installer overrides them)
locales locales/default_environment_locale select en_US.UTF-8
locales locales/locales_to_be_generated multiselect en_US.UTF-8 UTF-8, it_IT.UTF-8 UTF-8
keyboard-configuration keyboard-configuration/layoutcode string us
# libvirt / wireshark style prompts
libc6 libraries/restart-without-asking boolean true
# lightdm is the default display manager
lightdm shared/default-x-display-manager select lightdm
