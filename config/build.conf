# Omaxian OS build configuration (sourced by scripts/*.sh). Override any value
# from the environment, e.g.  BUILD_MIRROR=http://127.0.0.1:8099/merged make base
OMAXIAN_VERSION="${OMAXIAN_VERSION:-0.1}"
# Release codename (exact spelling) and its os-release/file-name form.
OMAXIAN_CODENAME="${OMAXIAN_CODENAME:-Transiberian Shaman}"
OMAXIAN_CODENAME_ID="${OMAXIAN_CODENAME_ID:-transiberian-shaman}"
ARCH=amd64

# Devuan suites
DEVUAN_SUITE=excalibur
DEVUAN_COMPONENTS="main contrib non-free non-free-firmware"
# Mirror written into the final image (/etc/apt/sources.list)
DEVUAN_MIRROR="${DEVUAN_MIRROR:-https://packages.devuan.org/merged}"
# Mirror used while building (may be a local cache/proxy, e.g. apt-cacher-ng)
BUILD_MIRROR="${BUILD_MIRROR:-$DEVUAN_MIRROR}"

# XLibre (third-party, single maintainer; TODO mirror into apt.omaxian.org)
XLIBRE_URI="${XLIBRE_URI:-https://xlibre-debian.github.io/devuan/}"
XLIBRE_SUITE=main
XLIBRE_COMPONENT=stable

# Omaxian OS own apt repo
OMAXIAN_APT_URI="${OMAXIAN_APT_URI:-https://apt.omaxian.org}"
OMAXIAN_APT_SUITE=excalibur
OMAXIAN_DOWNLOAD_URI="${OMAXIAN_DOWNLOAD_URI:-https://download.omaxian.org}"

# Upstream pins
OMAXIAN_SHELL_REPO=https://github.com/aozora/omaxian.git
OMAXIAN_SHELL_REF="${OMAXIAN_SHELL_REF:-v1.0.3}"
# Omarchy ref vendored into omaxian-session. Omaxian v1.0.3 itself pins v4.0.5;
# Omaxian main (v1.0.4) pins v4.0.6. We ship v4.0.6 on top of Omaxian v1.0.3
# (bug fixes). Set OMARCHY_REF= (empty) to follow the Omaxian setup.sh pin.
OMARCHY_REPO=https://github.com/omacom/omarchy.git
OMARCHY_REF="${OMARCHY_REF-v4.0.6}"
STRATA_REPO=lgse/strata
STRATA_VERSION="${STRATA_VERSION:-1.1.0}"
# Raw Ed25519 release key(s) from strata install.sh / data/update-keys.json
STRATA_RELEASE_KEYS="1589903225a2dd3c1bc87125884801552b07fd0a09855cfdbde3b84601cebf3c"

# Build locations
TOPDIR="${TOPDIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)}"
BUILDDIR="${BUILDDIR:-$TOPDIR/build}"
OUTDIR="${OUTDIR:-$TOPDIR/out}"
PAYLOADDIR="${PAYLOADDIR:-$TOPDIR/payload}"
LOCALREPO="${LOCALREPO:-$TOPDIR/repo-local}"
APT_CACHE="${APT_CACHE:-$BUILDDIR/apt-cache}"

# Live user
LIVE_USER=omaxian
LIVE_HOSTNAME=omaxian
DEFAULT_LOCALE=en_US.UTF-8
DEFAULT_TIMEZONE="${DEFAULT_TIMEZONE:-Europe/Rome}"
