# Omaxian OS build configuration (sourced by scripts/*.sh). Override any value
# from the environment, e.g.  BUILD_MIRROR=http://127.0.0.1:8099/merged make base
OMAXIAN_VERSION="${OMAXIAN_VERSION:-0.3}"
# Release codename (exact spelling) and its os-release/file-name form.
OMAXIAN_CODENAME="${OMAXIAN_CODENAME:-Space Cat}"
OMAXIAN_CODENAME_ID="${OMAXIAN_CODENAME_ID:-space-cat}"
# short form for the 32-char ISO volume id
OMAXIAN_CODENAME_TAG="${OMAXIAN_CODENAME_TAG:-SPACE_CAT}"
ARCH=amd64

# Devuan suites
DEVUAN_SUITE=excalibur
DEVUAN_COMPONENTS="main contrib non-free non-free-firmware"
# Mirror written into the final image (/etc/apt/sources.list)
DEVUAN_MIRROR="${DEVUAN_MIRROR:-https://packages.devuan.org/merged}"
# Mirror used while building (may be a local cache/proxy, e.g. apt-cacher-ng)
BUILD_MIRROR="${BUILD_MIRROR:-$DEVUAN_MIRROR}"

# XLibre (third-party, single maintainer; TODO mirror into apt.omaxian.org)
XLIBRE_URI="${XLIBRE_URI:-https://xlibre-debian.github.io/devuan/}"
XLIBRE_SUITE=main
XLIBRE_COMPONENT=stable

# Omaxian OS own apt repo
OMAXIAN_APT_URI="${OMAXIAN_APT_URI:-https://apt.omaxian.org}"
OMAXIAN_APT_SUITE=excalibur
OMAXIAN_DOWNLOAD_URI="${OMAXIAN_DOWNLOAD_URI:-https://download.omaxian.org}"

# Upstream pins
OMAXIAN_SHELL_REPO=https://github.com/aozora/omaxian.git
OMAXIAN_SHELL_REF="${OMAXIAN_SHELL_REF:-v1.2.3}"
# Commit the tag must resolve to (fetch-omaxian.sh fails otherwise; it also
# checks the commit is on main and its `version` file equals the ref).
# v1.2.3 tag = 19250aaa (release https://github.com/aozora/omaxian/releases/tag/v1.2.3),
# verified 2026-11-25 with git ls-remote refs/tags/v1.2.3.
OMAXIAN_SHELL_COMMIT="${OMAXIAN_SHELL_COMMIT:-19250aaa43a264ae60f9b27899657985505764ed}"
# Omarchy ref vendored into omaxian-session. Empty (default) = follow the pin in
# the Omaxian checkout's scripts/setup.sh (UPSTREAM_REF; v1.0.4 pins v4.0.6).
# Set OMARCHY_REF=vX.Y.Z to override.
OMARCHY_REPO=https://github.com/omacom/omarchy.git
OMARCHY_REF="${OMARCHY_REF-}"
STRATA_REPO=lgse/strata
STRATA_VERSION="${STRATA_VERSION:-1.2.2}"
# Raw Ed25519 release key(s) from strata install.sh / data/update-keys.json
STRATA_RELEASE_KEYS="1589903225a2dd3c1bc87125884801552b07fd0a09855cfdbde3b84601cebf3c"

# JetBrains Mono Nerd Font (mandatory, omaxian-fonts-nerd). Official
# ryanoasis/nerd-fonts release asset, pinned by SHA-256 (also cross-checked
# against the release's SHA-256.txt). Variants = TTF name infix after
# "JetBrainsMono": NerdFont (terminals/i3/dunst use "JetBrainsMono Nerd Font"),
# NerdFontMono (strict single-width icons), optional NerdFontPropo, NL*.
NERD_FONTS_REPO=ryanoasis/nerd-fonts
NERD_FONTS_VERSION="${NERD_FONTS_VERSION:-3.5.1}"
NERD_FONTS_JBM_SHA256="${NERD_FONTS_JBM_SHA256:-04d5e8f903693f9dd13e16f867e994834e681eb3c72c0d337a770dcda09010cf}"
NERD_FONTS_JBM_VARIANTS="${NERD_FONTS_JBM_VARIANTS:-NerdFont NerdFontMono}"

# VoxType (optional "Voice dictation" group, FULL ISO offline pool only):
# the upstream .deb, unmodified. Pinned version + sha256; at fetch time the
# detached signature (.deb.asc) must verify with the pinned release key
# (config/upstream-keys/voxtype-release.asc, fingerprint below) and the signed
# SHA256SUMS.txt must verify too (it lists the binaries, not the .deb).
VOXTYPE_REPO=peteonrails/voxtype
VOXTYPE_VERSION="${VOXTYPE_VERSION:-1.1.1}"
VOXTYPE_DEB_REV="${VOXTYPE_DEB_REV:-1}"
VOXTYPE_DEB_SHA256="${VOXTYPE_DEB_SHA256:-1d4767ca7bd7e4745b0a066febd7b4b81ba8af7546385c664ce2efb0fe57ed3c}"
VOXTYPE_SIGNING_FPR="${VOXTYPE_SIGNING_FPR:-9CCF7915B750CAE8B095ED1AA3FC9F33FD209279}"

# Build locations
TOPDIR="${TOPDIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)}"
BUILDDIR="${BUILDDIR:-$TOPDIR/build}"
OUTDIR="${OUTDIR:-$TOPDIR/out}"
PAYLOADDIR="${PAYLOADDIR:-$TOPDIR/payload}"
LOCALREPO="${LOCALREPO:-$TOPDIR/repo-local}"
APT_CACHE="${APT_CACHE:-$BUILDDIR/apt-cache}"

# Live user
LIVE_USER=omaxian
LIVE_HOSTNAME=omaxian
DEFAULT_LOCALE=en_US.UTF-8
DEFAULT_TIMEZONE="${DEFAULT_TIMEZONE:-Europe/Rome}"

# ydotool (package omaxian-ydotool): built from source at package build time.
# Pinned tag + commit + sha256 of the GitHub source archive of that tag
# (scripts/fetch-ydotool.sh refuses anything else).
YDOTOOL_REPO=ReimuNotMoe/ydotool
YDOTOOL_VERSION="${YDOTOOL_VERSION:-1.0.4}"
YDOTOOL_COMMIT="${YDOTOOL_COMMIT:-57ba7d0af525e82da2de0e275d169477f293b197}"
YDOTOOL_SRC_SHA256="${YDOTOOL_SRC_SHA256:-ba075a43aa6ead51940e892ecffa4d0b8b40c241e4e2bc4bd9bd26b61fde23bd}"

# Not in Devuan Excalibur. Pinned upstream releases (scripts/fetch-third-party.sh).
# chezmoi publishes a glibc .deb with no Depends. rustic publishes a glibc
# binary tarball (packaged here as the `rustic` binary package). MyGo Music
# (https://music.egoist.dev/, github.com/egoist/mygo-music) publishes an amd64
# .deb; the site is the project page, the player is the native app.
CHEZMOI_VERSION="${CHEZMOI_VERSION:-2.74.2}"
CHEZMOI_DEB_SHA256="${CHEZMOI_DEB_SHA256:-0493cbc4872a6dfdf4418b5a9b7d72fd8d863459740f64625374e5fce6d5081f}"
RUSTIC_VERSION="${RUSTIC_VERSION:-0.12.0}"
RUSTIC_TARBALL_SHA256="${RUSTIC_TARBALL_SHA256:-8995d790c25edb457be0d0c3b0efc6423ee141939ac06f98d74a7da28c671474}"
MYGO_VERSION="${MYGO_VERSION:-0.1.26}"
MYGO_DEB_SHA256="${MYGO_DEB_SHA256:-ff6c8eac685c6496a547a4242af31e177084ca54358d2c2c01f18d431832c24a}"
# Typecase (github.com/iretonsean/typecase): no release tags. Pinned commit of
# main on 2026-11-25, GitHub archive sha256.
TYPECASE_COMMIT="${TYPECASE_COMMIT:-3119bedca73c0a80ed39c05079dd5dcdc7672e33}"
TYPECASE_SHA256="${TYPECASE_SHA256:-62632bf5fa1e07d5df1d89949af055e45aa6bf454cc69122e058d5c2eace7a2b}"
