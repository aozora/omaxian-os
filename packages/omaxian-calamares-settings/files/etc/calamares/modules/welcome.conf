---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    false
requirements:
    requiredStorage:    20
    requiredRam:        2.0
    # No "internet" check: the install is fully offline (unpackfs + local
    # packages), and Calamares re-runs the checks every few seconds while
    # any of them is unsatisfied, so an offline machine sat on the Welcome
    # page with a never-ending countdown spinner.
    check: [ storage, ram, power, root, screen ]
    required: [ storage, ram, root ]
# Preselect the installer language from geoip (Italy -> Italiano). The
# keyboard module guesses its default layout from that language, not from
# the live session's X layout. Offline: falls back to the live LANG (en_US).
geoip:
    style:    "json"
    url:      "https://geoip.kde.org/v1/calamares"
    selector: ""
