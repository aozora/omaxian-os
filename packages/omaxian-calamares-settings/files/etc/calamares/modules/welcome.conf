---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    false
requirements:
    requiredStorage:    20
    requiredRam:        2.0
    internetCheckUrl:   https://deb.devuan.org
    check: [ storage, ram, power, root, screen, internet ]
    required: [ storage, ram, root ]
# Preselect the installer language from geoip (Italy -> Italiano). The
# keyboard module guesses its default layout from that language, not from
# the live session's X layout. Offline: falls back to the live LANG (en_US).
geoip:
    style:    "json"
    url:      "https://geoip.kde.org/v1/calamares"
    selector: ""
