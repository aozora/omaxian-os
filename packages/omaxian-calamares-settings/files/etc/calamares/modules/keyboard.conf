---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true
# The live session runs with "us,it" (US first). Do NOT keep the live layout
# as the installer default: guess it from the installer language/locale
# instead (LANG it_IT -> "it", en_US -> "us"). The welcome module picks the
# language from geoip, so an Italian user gets an Italian layout by default.
guessLayout: true
useLocale1: false
