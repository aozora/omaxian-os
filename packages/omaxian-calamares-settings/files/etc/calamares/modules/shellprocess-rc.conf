---
# sysvinit replacement for the services-systemd module.
dontChroot: false
timeout: 120
script:
    - "-update-rc.d lightdm defaults"
    - "-update-rc.d network-manager defaults"
    - "-update-rc.d elogind defaults"
    - "-update-rc.d dbus defaults"
    - "-update-rc.d bluetooth defaults"
    - "-update-rc.d cups defaults"
    - "-update-rc.d libvirtd defaults"
    - "-update-rc.d power-profiles-daemon defaults"
    - "-update-rc.d omaxian-firstboot defaults"
    - "-update-rc.d ufw defaults"
