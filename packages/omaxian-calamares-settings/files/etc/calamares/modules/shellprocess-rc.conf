---
# sysvinit replacement for the services-systemd module.
dontChroot: false
timeout: 120
script:
    - "-update-rc.d lightdm defaults"
    - "-update-rc.d network-manager defaults"
    - "-update-rc.d elogind defaults"
    - "-update-rc.d dbus defaults"
    - "-update-rc.d bluetooth defaults"
    - "-update-rc.d cups defaults"
    # libvirtd only exists when the Virtualization group got installed now;
    # otherwise firstboot enables it after installing the pending group
    - "-test ! -x /etc/init.d/libvirtd || update-rc.d libvirtd defaults"
    - "-update-rc.d power-profiles-daemon defaults"
    - "-update-rc.d omaxian-firstboot defaults"
    - "-update-rc.d ufw defaults"
    # hardware support (omaxian-base / package init scripts; each one exits
    # cleanly on machines without the hardware)
    - "-update-rc.d chrony defaults"
    - "-update-rc.d open-vm-tools defaults"
    - "-update-rc.d omaxian-thermald defaults"
    - "-update-rc.d omaxian-iio-sensor-proxy defaults"
    - "-update-rc.d omaxian-switcheroo-control defaults"
    - "-update-rc.d omaxian-bolt defaults"
