# Omaxian OS: default file manager page. Both Strata and Folio are installed;
# this only picks the inode/directory handler for the new user (and, through
# /etc/omaxian/file-manager, for users created later). "legacy" writes the
# chosen id to GlobalStorage (packagechooser_filemanager); the omaxianfilemanager
# job applies it. Default: Strata (Omaxian's file manager since 0.1).
---
mode: required
method: legacy
labels:
    step: "File manager"
    step[it]: "Gestore file"
default: strata
items:
    - id: strata
      name: "Strata"
      description: "GTK 4 file manager, Omaxian's default. Tabs, split view, previews, archives and network places. Recommended."
      description[it]: "Gestore file GTK 4, predefinito in Omaxian. Schede, vista divisa, anteprime, archivi e risorse di rete. Consigliato."
      screenshot: "/usr/share/omaxian/installer/fm-strata.png"
    - id: folio
      name: "Folio"
      description: "Omarchy's Qt Quick file manager (community app). Fast icon grid and column views, quick preview, themed with the Omaxian colours."
      description[it]: "Il gestore file Qt Quick di Omarchy (app della community). Griglia di icone e vista a colonne, anteprima rapida, con i colori di Omaxian."
      screenshot: "/usr/share/omaxian/installer/fm-folio.png"
