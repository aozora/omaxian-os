---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - cdrom
    - floppy
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - bluetooth
    - lpadmin
    - scanner
    - sudo
    # created as system groups when the virtualization group is not
    # installed (libvirt-daemon-system's postinst accepts the existing group)
    - name: kvm
      must_exist: false
      system: true
    - name: libvirt
      must_exist: false
      system: true
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
setRootPassword: false
doReusePassword: false
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
userShell: /bin/bash
setHostname: EtcFile
writeHostsFile: true
presets:
    fullName: { editable: true }
    loginName: { editable: true }
