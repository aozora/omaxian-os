---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

instances:
- id:       omaxian-rc
  module:   shellprocess
  config:   shellprocess-rc.conf
- id:       omaxian-post
  module:   shellprocess
  config:   shellprocess-post.conf
- id:       omaxian-efi
  module:   shellprocess
  config:   shellprocess-efi.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - netinstall
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - omaxianlocale
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@omaxian-rc
  - shellprocess@omaxian-post
  - packages
  - omaxianoptional
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess@omaxian-efi
  - umount
- show:
  - finished

branding: omaxian
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
