# Omaxian OS greeter. Registered as the lightdm-gtk-greeter.conf alternative
# (priority 90, above desktop-base) by omaxian-branding.postinst.
[greeter]
background=/usr/share/omaxian/branding/greeter-background.png
user-background=false
theme-name=Adwaita-dark
icon-theme-name=Papirus-Dark
font-name=JetBrains Mono 11
default-user-image=/usr/share/omaxian/branding/omaxian-logo-128.png
position=50%,center 50%,center
clock-format=%a %d %b  %H:%M
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power
round-user-image=true
