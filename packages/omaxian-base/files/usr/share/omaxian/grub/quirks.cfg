# Omaxian OS: per-model kernel options, chosen at boot from SMBIOS (DMI).
#
# One source for both boot menus: the live ISO's grub.cfg sources this file
# (scripts/build-iso.sh) and /etc/grub.d/05_omaxian_quirks copies it into the
# installed system's grub.cfg. Every Linux entry ends with ${omaxian_quirks}
# (on the installed system via GRUB_CMDLINE_LINUX_DEFAULT in
# /etc/default/grub.d/omaxian.cfg); it stays empty on every machine below
# that does not match.
#
# Rules for new entries: match the vendor AND an exact model key (SKU or
# product name), add only options with a public bug report, and cite it.
# Idea from LCOS (lcos-live config/bootloaders/grub-pc/config.cfg); this is
# an independent implementation.
set omaxian_quirks=""
set omx_dmi_vendor=""
set omx_dmi_sku=""

# omx_dmi_string OFFSET VAR: string field at OFFSET of the SMBIOS type 1
# (System Information) table into VAR, or "" when the table is too short or
# the field is unset (no GRUB error message at boot either way).
function omx_dmi_string {
	set "${2}"=""
	if smbios --type 1 --get-byte 1 --set omx_dmi_len; then
		if [ "${omx_dmi_len}" -gt "${1}" ]; then
			if smbios --type 1 --get-byte "${1}" --set omx_dmi_idx; then
				if [ "${omx_dmi_idx}" != "0" ]; then
					smbios --type 1 --get-string "${1}" --set "${2}"
				fi
			fi
		fi
	fi
}

if insmod smbios; then
	omx_dmi_string 4 omx_dmi_vendor   # 0x04 Manufacturer
	omx_dmi_string 25 omx_dmi_sku     # 0x19 SKU Number (SMBIOS >= 2.4)

	# Dell XPS 13 DX13260 (Intel Wildcat Lake, DMI SKU 0E53): the 120 Hz eDP
	# panel judders with Panel Replay enabled in the xe driver (drm/xe issue
	# #8930 as cited by LCOS; no in-kernel quirk yet). PSR itself stays on.
	# Source: LCOS 1.0.1 release notes ("support for the latest Dell XPS 13
	# models") and lcos-live config/bootloaders/grub-pc/config.cfg.
	# (LCOS also forces mem_sleep_default=s2idle there; its cause is
	# unconfirmed and elogind overrides it, so it is not copied.)
	if [ "${omx_dmi_vendor}" = "Dell Inc." ]; then
		if [ "${omx_dmi_sku}" = "0E53" ]; then
			set omaxian_quirks="xe.enable_panel_replay=0"
		fi
	fi
fi
