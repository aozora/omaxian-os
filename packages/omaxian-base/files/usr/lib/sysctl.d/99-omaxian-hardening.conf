# Omaxian OS (omaxian-base): kernel hardening defaults.
# Override in /etc/sysctl.d/99-omaxian-hardening.conf (same name wins).
#
# Unprivileged bpf() off. Debian's kernel already defaults to 2 (off, but
# root may switch it back on at runtime); 1 keeps it off until reboot.
# Nothing in Omaxian OS needs unprivileged BPF.
kernel.unprivileged_bpf_disabled = 1
#
# User namespaces stay enabled (kernel default): Flatpak/bubblewrap, browser
# sandboxes (Brave, Chromium), Steam and rootless podman need them.
