# Omaxian OS GRUB defaults. Calamares' grubcfg writes 00calamares.cfg
# (sourced before this file): keep its kernel command line (resume=,
# cryptdevice=...) and only fill in what is missing.
GRUB_DISTRIBUTOR="Omaxian OS"
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:-quiet splash}"
case " $GRUB_CMDLINE_LINUX_DEFAULT " in *" splash "*) ;; *) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT splash" ;; esac
GRUB_TIMEOUT="${GRUB_TIMEOUT:-5}"
GRUB_TERMINAL_OUTPUT="${GRUB_TERMINAL_OUTPUT:-gfxterm}"
