<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Omaxian OS: JetBrains Mono Nerd Font is the default monospace family.
     Loaded before 60-latin.conf so it is prepended to that prefer list.
     (omaxian-fonts-nerd; remove the conf.d link to opt out.) -->
<fontconfig>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>JetBrains Mono</family>
    </prefer>
  </alias>
</fontconfig>
