# SKETCH - not yet exercised. Copy to .github/workflows/ when the repo goes to GitHub.
# Needs repository secrets: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT,
# OMAXIAN_SIGNING_KEY (ASCII-armoured private subkey, see docs/signing-key.md).
name: build
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
    inputs:
      flavor: { description: 'base|full|both', default: base }
      publish: { description: 'upload to R2', type: boolean, default: false }
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap reprepro squashfs-tools xorriso grub-pc-bin \
            grub-efi-amd64-bin mtools dpkg-dev debhelper devscripts rsync jq gnupg \
            qemu-system-x86 ovmf awscli minisign
      - name: import signing key
        if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/') }}
        env: { OMAXIAN_SIGNING_KEY: '${{ secrets.OMAXIAN_SIGNING_KEY }}' }
        run: |
          mkdir -p keys/private/gnupg && chmod 700 keys/private/gnupg
          echo "$OMAXIAN_SIGNING_KEY" | GNUPGHOME=keys/private/gnupg gpg --batch --import
          # export public keyring + fingerprint the way gen-test-key.sh does
          mkdir -p keys/public
          GNUPGHOME=keys/private/gnupg gpg --export > keys/public/omaxian-archive-keyring.pgp
          GNUPGHOME=keys/private/gnupg gpg --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}' > keys/public/fingerprint
      - name: test key (PR builds)
        if: ${{ !(inputs.publish || startsWith(github.ref, 'refs/tags/')) }}
        run: bash scripts/gen-test-key.sh
      - run: bash scripts/fetch-omaxian.sh && bash scripts/fetch-strata.sh
      - run: bash scripts/build-packages.sh && bash scripts/make-repo.sh
      - run: sudo -E bash scripts/build-rootfs.sh base && sudo -E bash scripts/build-iso.sh base
      - if: ${{ inputs.flavor != 'base' }}
        run: sudo -E bash scripts/build-rootfs.sh full && sudo -E bash scripts/build-iso.sh full
      - name: smoke boot (TCG, screenshots)
        run: SECS=600 bash scripts/boot-test.sh out/omaxian-base-*-amd64.iso bios 600 ci-base || true
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: shots/ }
      - name: publish
        if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/') }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DRY_RUN: '0'
        run: bash scripts/publish-r2.sh apt && bash scripts/publish-r2.sh iso
